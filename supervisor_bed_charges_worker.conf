; =====================================================
; Supervisor Configuration for Bed Charges Queue Worker
; =====================================================
; Place this file in: /etc/supervisor/conf.d/laravel-worker-bed-charges.conf
; Or on Windows: Use Task Scheduler or similar service manager
; =====================================================

[program:laravel-worker-bed-charges]
process_name=%(program_name)s_%(process_num)02d
command=php /path-to-project/artisan queue:work database --queue=bed-charges --sleep=3 --tries=3 --max-time=3600 --timeout=300
directory=/path-to-project
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/path-to-project/storage/logs/worker-bed-charges.log
stopwaitsecs=3600
priority=999

; =====================================================
; Configuration Notes:
; =====================================================
; 1. Replace /path-to-project with your actual project path
; 2. Adjust numprocs based on your server capacity (2-4 recommended)
; 3. Adjust user based on your web server user (www-data, apache, nginx, etc.)
; 4. max-time: Maximum seconds a worker can run before restarting (prevents memory leaks)
; 5. timeout: Maximum seconds a job can run before timing out
; 6. sleep: Seconds to wait before checking for new jobs when queue is empty
; =====================================================

; =====================================================
; Supervisor Commands:
; =====================================================
; sudo supervisorctl reread
; sudo supervisorctl update
; sudo supervisorctl start laravel-worker-bed-charges:*
; sudo supervisorctl status laravel-worker-bed-charges:*
; sudo supervisorctl stop laravel-worker-bed-charges:*
; sudo supervisorctl restart laravel-worker-bed-charges:*
; =====================================================
